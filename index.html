<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中1理科：凸レンズの実像と虚像のでき方シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      touch-action: none;
    }

    /* ボタンを押したときのフィードバック */
    .btn-touch {
      transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-touch:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* 距離プリセットボタンのアクティブ演出（実像：シアン／虚像：パープル系） */
    .pos-btn.active-real {
      background-color: rgba(56, 189, 248, 0.22);
      color: #bae6fd;
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }
    .pos-btn.active-virtual {
      background-color: rgba(192, 132, 252, 0.24);
      color: #f3e8ff;
      border-color: #c084fc;
      box-shadow: 0 0 14px rgba(192, 132, 252, 0.45);
    }

    /* スクロールバー非表示（狭い画面のボタンバー用） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col justify-between w-screen h-screen overflow-hidden select-none">

  <!-- 上部ヘッダー：タイトル ＆ 実験条件バッジ -->
  <header class="w-full bg-slate-900/95 border-b-2 border-slate-800 px-3 sm:px-4 py-2 flex items-center justify-between gap-2 shrink-0 z-20 shadow-lg min-h-[58px]">
    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
      <div class="bg-amber-400 text-slate-950 font-black px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm lg:text-base tracking-wider shadow shrink-0">
        中1理科
      </div>
      <h1 class="text-sm sm:text-base lg:text-xl font-black tracking-tight text-slate-100 truncate">
        凸レンズの実像と虚像のでき方
      </h1>
    </div>

    <!-- 固定条件バッジ（焦点距離・光源の高さ） -->
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      <div class="bg-slate-800/90 border border-cyan-500/40 px-2.5 sm:px-3 py-1 rounded-xl flex items-center gap-1.5 text-xs sm:text-sm font-bold">
        <span class="text-cyan-300">焦点距離</span>
        <span class="text-white font-black">10 cm</span>
      </div>
      <div class="hidden sm:flex bg-slate-800/90 border border-amber-400/40 px-3 py-1 rounded-xl items-center gap-1.5 text-xs sm:text-sm font-bold">
        <span class="text-amber-300">光源の高さ</span>
        <span class="text-white font-black">3.0 cm</span>
      </div>
    </div>
  </header>

  <!-- 中央メインキャンバス領域 -->
  <main class="relative flex-1 w-full h-full overflow-hidden bg-slate-950">
    <canvas id="simCanvas" class="w-full h-full block"></canvas>

    <!-- 上部中央：フローティング解説バナー（「数値・解説」ON時に表示） -->
    <div id="statusBanner" class="flex absolute top-3 left-1/2 -translate-x-1/2 items-center gap-2 bg-slate-900/92 backdrop-blur border-2 border-amber-400/75 px-4 py-1.5 rounded-2xl shadow-xl pointer-events-none z-10 max-w-[92%] sm:max-w-[54%] transition-opacity duration-200">
      <span id="statusIcon" class="text-lg sm:text-xl shrink-0">💡</span>
      <p id="statusText" class="text-xs sm:text-sm font-bold text-amber-200 tracking-wide leading-snug">
        光源の位置を選んで「光を出す」を押してみよう
      </p>
    </div>

    <!-- 左上：観測データパネル（像の種類・位置・大きさ・倍率） -->
    <div id="dataCard" class="absolute top-14 sm:top-3 left-3 bg-slate-900/90 backdrop-blur border border-slate-700/90 rounded-2xl p-2.5 sm:p-3 shadow-xl z-10 w-[195px] sm:w-[238px] pointer-events-auto">
      <div class="flex items-center justify-between border-b border-slate-700/80 pb-1.5 mb-2">
        <span class="text-[11px] sm:text-xs font-black text-slate-300 tracking-wider">📏 観測データ</span>
        <span id="imageTypeBadge" class="px-2 py-0.5 rounded-lg text-[10px] sm:text-xs font-black bg-amber-500/20 text-amber-200 border border-amber-400/50">
          予想してみよう
        </span>
      </div>

      <div class="space-y-1.5 text-xs sm:text-sm">
        <div class="flex items-center justify-between">
          <span class="text-slate-400 font-bold">光源の位置</span>
          <span id="valSourceDist" class="font-black text-amber-300">左 30.0 cm</span>
        </div>

        <div id="dataRevealArea" class="space-y-1.5">
          <div class="flex items-center justify-between">
            <span id="lblImagePos" class="text-slate-400 font-bold">像のできる位置</span>
            <span id="valImagePos" class="font-black text-slate-400">？ cm</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-400 font-bold">像の大きさ</span>
            <span id="valImageSize" class="font-black text-slate-400">？ cm</span>
          </div>
          <div id="screenPosRow" class="flex items-center justify-between pt-1 border-t border-slate-800 text-[11px] sm:text-xs">
            <span class="text-slate-400 font-bold">スクリーン位置</span>
            <span id="valScreenPos" class="font-bold text-slate-500">まだ出ていません</span>
          </div>
        </div>

        <!-- 数値隠しモード時の表示 -->
        <div id="dataHiddenNote" class="hidden py-2 text-center bg-slate-950/70 rounded-xl border border-slate-800 text-xs font-bold text-slate-400">
          🔒 数値は非表示中<br><span class="text-[10px] text-slate-500">目盛りから読み取ろう</span>
        </div>
      </div>
    </div>

    <!-- 右上：スクリーン／レンズのぞき見ミニモニター ＆ 拡大縮小 -->
    <div class="absolute top-14 sm:top-3 right-3 flex items-start gap-2 z-10">
      <!-- ミニモニター（スクリーン正面／虫めがね視点） -->
      <div class="hidden md:flex flex-col items-center bg-slate-900/90 backdrop-blur border border-slate-700/90 rounded-2xl p-2 shadow-xl w-[132px]">
        <div class="flex items-center justify-between w-full mb-1 px-0.5">
          <span id="previewTitle" class="text-[10px] font-black text-slate-300">📺 像の見え方</span>
          <span id="previewFocusTag" class="text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">予想中</span>
        </div>
        <canvas id="previewCanvas" width="112" height="112" class="w-[112px] h-[112px] rounded-xl bg-slate-950 border border-slate-700"></canvas>
      </div>

      <!-- 拡大・縮小コントロール -->
      <div class="flex flex-col gap-1.5 bg-slate-900/90 backdrop-blur p-1.5 rounded-2xl border border-slate-700 shadow-xl">
        <button id="zoomInBtn" class="btn-touch w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-black text-lg sm:text-xl flex items-center justify-center border border-slate-600 cursor-pointer" title="拡大する">
          ＋
        </button>
        <button id="zoomResetBtn" class="btn-touch w-9 sm:w-10 py-1 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-cyan-300 font-bold text-[10px] sm:text-[11px] flex items-center justify-center border border-slate-700 cursor-pointer" title="全体表示に戻す">
          <span id="zoomLabel">100%</span>
        </button>
        <button id="zoomOutBtn" class="btn-touch w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-black text-lg sm:text-xl flex items-center justify-center border border-slate-600 cursor-pointer" title="縮小する">
          －
        </button>
      </div>
    </div>

    <!-- 左下：2つの光の凡例 -->
    <div class="hidden sm:flex absolute bottom-3 left-3 items-center gap-3 bg-slate-900/88 backdrop-blur px-3.5 py-2 rounded-2xl border border-slate-700/80 shadow-lg z-10 text-xs font-bold pointer-events-none">
      <div class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]"></span>
        <span class="text-amber-200">① 光軸に平行な光</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
        <span class="text-emerald-200">② レンズの中心を通る光</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-4 border-t-2 border-dashed border-purple-300"></span>
        <span class="text-purple-200">虚像の延長線</span>
      </div>
    </div>

    <!-- 右下：操作ヒント -->
    <div class="hidden lg:flex absolute bottom-3 right-3 items-center gap-2 bg-slate-900/85 backdrop-blur px-3 py-1.5 rounded-2xl border border-slate-700/80 shadow-lg z-10 text-[11px] font-bold text-slate-400 pointer-events-none">
      <span>👆 光源を動かして予想 →「光を出す」で結像 ／ スクリーン出現後は左右移動OK</span>
    </div>
  </main>

  <!-- 下部コントロールバー -->
  <footer class="w-full bg-slate-900 border-t-2 border-slate-800 px-2.5 sm:px-3 py-2 flex items-center justify-between gap-2 shrink-0 z-20 overflow-x-auto no-scrollbar">

    <!-- 左：光を出す／消すボタン ＆ 5つの距離プリセット -->
    <div class="flex items-center gap-2 shrink-0">
      <button id="emitLightBtn" class="btn-touch flex items-center gap-1.5 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-300 hover:to-orange-300 text-slate-950 font-black text-xs sm:text-sm lg:text-base px-3.5 sm:px-4 py-2 rounded-2xl shadow-lg border-2 border-amber-200 cursor-pointer shrink-0">
        <span id="emitIcon" class="text-base sm:text-lg">💡</span>
        <span id="emitLabel">光を出す</span>
      </button>

      <div class="h-7 w-[2px] bg-slate-800 hidden sm:block"></div>

      <!-- 光源の位置プリセット（30, 20, 15, 7, 5cm） -->
      <div class="flex items-center gap-1 bg-slate-950/85 p-1 rounded-2xl border border-slate-800">
        <span class="hidden xl:inline text-[11px] font-black text-slate-400 px-1.5">光源位置:</span>
        <button data-pos="30" class="pos-btn active-real btn-touch px-2.5 sm:px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm text-slate-300 border-2 border-transparent cursor-pointer">
          30cm
        </button>
        <button data-pos="20" class="pos-btn btn-touch px-2.5 sm:px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm text-slate-300 border-2 border-transparent cursor-pointer">
          20cm
        </button>
        <button data-pos="15" class="pos-btn btn-touch px-2.5 sm:px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm text-slate-300 border-2 border-transparent cursor-pointer">
          15cm
        </button>
        <div class="w-[1px] h-5 bg-slate-700 mx-0.5" title="焦点(10cm)の境界"></div>
        <button data-pos="7" class="pos-btn btn-touch px-2.5 sm:px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm text-slate-300 border-2 border-transparent cursor-pointer">
          7cm
        </button>
        <button data-pos="5" class="pos-btn btn-touch px-2.5 sm:px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm text-slate-300 border-2 border-transparent cursor-pointer">
          5cm
        </button>
      </div>
    </div>

    <!-- 右：スクリーン自動ピント・数値表示トグル・リセット -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="autoFocusBtn" disabled class="btn-touch bg-slate-900/70 text-slate-500 border-2 border-slate-800 font-bold text-xs sm:text-sm px-2.5 sm:px-3 py-2 rounded-2xl cursor-not-allowed flex items-center gap-1 opacity-60" title="スクリーンを実像ができる位置に自動で合わせます">
        <span>🎯</span>
        <span id="autoFocusLabel">自動ピント</span>
      </button>

      <button id="toggleInfoBtn" class="btn-touch bg-slate-700 text-amber-300 border-2 border-amber-400 font-bold text-xs sm:text-sm px-2.5 sm:px-3 py-2 rounded-2xl shadow cursor-pointer flex items-center gap-1">
        <span id="infoCheck">☑</span>
        <span>数値・解説</span>
      </button>

      <button id="resetBtn" class="btn-touch bg-slate-800 hover:bg-slate-700 text-slate-300 border-2 border-slate-600 font-bold text-xs sm:text-sm px-2.5 sm:px-3 py-2 rounded-2xl shadow cursor-pointer">
        リセット
      </button>
    </div>
  </footer>

  <script>
    // ==========================================
    // DOM要素の取得
    // ==========================================
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const pCtx = previewCanvas.getContext('2d');

    const statusBanner = document.getElementById('statusBanner');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');

    const imageTypeBadge = document.getElementById('imageTypeBadge');
    const valSourceDist = document.getElementById('valSourceDist');
    const lblImagePos = document.getElementById('lblImagePos');
    const valImagePos = document.getElementById('valImagePos');
    const valImageSize = document.getElementById('valImageSize');
    const screenPosRow = document.getElementById('screenPosRow');
    const valScreenPos = document.getElementById('valScreenPos');
    const dataRevealArea = document.getElementById('dataRevealArea');
    const dataHiddenNote = document.getElementById('dataHiddenNote');

    const previewTitle = document.getElementById('previewTitle');
    const previewFocusTag = document.getElementById('previewFocusTag');

    const emitLightBtn = document.getElementById('emitLightBtn');
    const emitIcon = document.getElementById('emitIcon');
    const emitLabel = document.getElementById('emitLabel');
    const posButtons = document.querySelectorAll('.pos-btn');

    const autoFocusBtn = document.getElementById('autoFocusBtn');
    const autoFocusLabel = document.getElementById('autoFocusLabel');
    const toggleInfoBtn = document.getElementById('toggleInfoBtn');
    const infoCheck = document.getElementById('infoCheck');
    const resetBtn = document.getElementById('resetBtn');

    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomLabel = document.getElementById('zoomLabel');

    // ==========================================
    // 光学定数 ＆ 状態変数
    // ==========================================
    const FOCAL_CM = 10.0;          // 焦点距離 10cm 固定
    const SOURCE_HEIGHT_CM = 3.0;   // 光源（矢印）の高さ 3.0cm
    const PX_PER_CM = 14;           // 基準スケール (1cm = 14px)
    const LENS_HALF_H_CM = 9.5;     // 凸レンズの半径（高さの半分）
    const SCREEN_HALF_H_CM = 8.5;   // スクリーンの高さの半分
    const MIN_SOURCE_CM = 3.5;      // 光源の最小距離
    const MAX_SOURCE_CM = 35.0;     // 光源の最大距離
    const MIN_SCREEN_CM = 6.0;      // スクリーンの最小距離
    const MAX_SCREEN_CM = 38.0;     // スクリーンの最大距離
    const PRESET_POSITIONS = [30, 20, 15, 10, 7, 5];

    // 光線のカラーパレット（index.html の発光レーザー表現を踏襲）
    const RAY_COLORS = {
      parallel: {
        core: '#ffffff',
        mid: '#fde047',
        glow: 'rgba(245, 158, 11, 0.35)',
        shadow: '#f59e0b'
      },
      center: {
        core: '#ffffff',
        mid: '#6ee7b7',
        glow: 'rgba(16, 185, 129, 0.35)',
        shadow: '#10b981'
      }
    };

    // キャンバス・ビューポート状態
    let width = 0;
    let height = 0;
    let zoom = 1.0;
    let baseZoom = 1.0;
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 2.6;
    let panX = 0;
    let panY = 0;

    // 光学シミュレーション状態
    let sourceDistCm = 30.0;       // 現在の光源位置 (cm)
    let screenDistCm = 15.0;       // 現在のスクリーン位置 (cm)
    let isAutoFocus = true;        // スクリーン自動ピントフラグ
    let showInfo = true;           // 数値・解説バナーの表示フラグ

    let isLightActive = false;     // 光の点灯状態
    let animProgress = 0;          // 光アニメーション進行度 (0.0 〜 1.0)
    let isAnimating = false;       // アニメーション再生中フラグ
    let hasRevealedResult = false; // 光が集まって像・結果が表示されたかどうかのフラグ
    const ANIM_SPEED = 0.0055;     // 生徒が目で追いやすいゆっくりスピード
    let pulseTime = 0;             // アニメーション完了後の光パルス用

    // ポインター・タッチ操作状態
    let draggingTarget = null;     // 'source' | 'screen' | 'pan' | null
    let hoverTarget = null;        // 'source' | 'screen' | null
    let pointerDownX = 0;
    let pointerDownY = 0;
    let panStartX = 0;
    let panStartY = 0;
    let hasDragged = false;
    let initialPinchDist = null;
    let initialPinchZoom = 1.0;

    // ==========================================
    // 光学計算エンジン
    // ==========================================
    // 実像ができてスクリーンを表示すべき状態かどうかを判定
    function isScreenVisible(opt) {
      return isLightActive && opt.type === 'real' && animProgress >= 0.88;
    }

    function calculateOptics() {
      const u = sourceDistCm;
      const f = FOCAL_CM;
      const h = SOURCE_HEIGHT_CM;

      const sx = -u * PX_PER_CM;
      const sy = -h * PX_PER_CM; // キャンバス上方向がマイナス
      const fPx = f * PX_PER_CM;
      const screenX = screenDistCm * PX_PER_CM;

      let type = 'none'; // 'real' | 'virtual' | 'none'
      let v = Infinity;
      let mag = 0;
      let imgHeightCm = 0;
      let imgX = 0;
      let imgTipY = 0;

      if (Math.abs(u - f) < 0.15) {
        type = 'none';
      } else if (u > f) {
        type = 'real';
        v = (u * f) / (u - f);
        mag = v / u;
        imgHeightCm = h * mag;
        imgX = v * PX_PER_CM;
        imgTipY = imgHeightCm * PX_PER_CM; // 倒立なので下方向（プラス）
      } else {
        type = 'virtual';
        v = (u * f) / (u - f); // 負の値（レンズの左側）
        mag = Math.abs(v) / u;
        imgHeightCm = h * mag;
        imgX = v * PX_PER_CM; // 負のX座標（左側）
        imgTipY = -imgHeightCm * PX_PER_CM; // 正立なので上方向（マイナス）
      }

      // ① 平行な光：(sx, sy) -> (0, sy) -> 右焦点(fPx, 0)を通って直進
      const slopeParallel = (0 - sy) / (fPx - 0);
      // ② 中心を通る光：(sx, sy) -> (0, 0) をそのまま直進
      const slopeCenter = (0 - sy) / (0 - sx);

      // 右側の光が到達するX座標
      // 実像時はスクリーン（結像点）まで。虚像・焦点上はスクリーンを出さず右へ伸ばす
      let rightEndX = screenX;
      if (type === 'virtual') {
        rightEndX = 24 * PX_PER_CM;
      } else if (type === 'none') {
        rightEndX = 28 * PX_PER_CM;
      }

      const y1AtRight = sy + slopeParallel * rightEndX;
      const y2AtRight = slopeCenter * rightEndX;

      // スクリーン上でのピント判定（実像時のみ意味を持つ）
      const spreadPx = Math.abs(y1AtRight - y2AtRight);
      const isFocused = type === 'real' && Math.abs(screenDistCm - v) < 0.35;
      const screenTipY = (y1AtRight + y2AtRight) / 2;

      return {
        u,
        f,
        h,
        sx,
        sy,
        fPx,
        type,
        v,
        mag,
        imgHeightCm,
        imgX,
        imgTipY,
        screenX,
        rightEndX,
        slopeParallel,
        slopeCenter,
        y1AtRight,
        y2AtRight,
        spreadPx,
        isFocused,
        screenTipY
      };
    }

    // 自動ピント時にスクリーン位置を実像位置へ同期
    function syncScreenToAutoFocus() {
      if (!isAutoFocus) return;
      const u = sourceDistCm;
      if (u > FOCAL_CM + 0.15) {
        const v = (u * FOCAL_CM) / (u - FOCAL_CM);
        screenDistCm = Math.max(MIN_SCREEN_CM, Math.min(MAX_SCREEN_CM, v));
      } else {
        screenDistCm = 20.0;
      }
    }

    // ==========================================
    // 画面リサイズ・座標変換・全体フィット
    // ==========================================
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fitToScreen();
    }

    function fitToScreen() {
      // 左34cm〜右34cm（計68cm）、上下26cmがちょうど収まるズーム率を計算
      const targetWorldW = 68 * PX_PER_CM;
      const targetWorldH = 26 * PX_PER_CM;
      const fitW = (width * 0.92) / targetWorldW;
      const fitH = (height * 0.80) / targetWorldH;
      baseZoom = Math.max(MIN_ZOOM, Math.min(1.35, Math.min(fitW, fitH)));
      zoom = baseZoom;
      panX = 0;
      panY = height * 0.03; // 上部バナーを避けてわずかに下へ配置
      zoomLabel.textContent = '100%';
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - (width / 2 + panX)) / zoom,
        y: (sy - (height / 2 + panY)) / zoom
      };
    }

    function setZoom(newZoom, anchorScreenX = width / 2, anchorScreenY = height / 2) {
      const clampedZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
      const beforeWorld = screenToWorld(anchorScreenX, anchorScreenY);
      zoom = clampedZoom;
      panX = anchorScreenX - width / 2 - beforeWorld.x * zoom;
      panY = anchorScreenY - height / 2 - beforeWorld.y * zoom;

      const maxPan = 600 * zoom;
      panX = Math.max(-maxPan, Math.min(maxPan, panX));
      panY = Math.max(-maxPan, Math.min(maxPan, panY));

      const relPercent = Math.round((zoom / baseZoom) * 100);
      zoomLabel.textContent = `${relPercent}%`;
    }

    function updateStatusBanner(opt) {
      if (!showInfo) {
        statusBanner.classList.add('hidden');

      statusBanner.classList.remove('hidden');
      statusBanner.classList.add('flex');

        return;
      }

      // 光がまだ集まりきっていない移動中のメッセージ
      if (animProgress < 0.88) {
        statusIcon.textContent = '✨';
        statusText.textContent = '2つの光が凸レンズを通って進んでいます… どこに集まるかな？';
        return;
      }

      if (opt.type === 'real') {
        if (opt.isFocused) {
          statusIcon.textContent = '🎯';

          if (Math.abs(opt.u - 20) < 0.3) {
            relation = '焦点距離の2倍(20cm)なので、同じ大きさの倒立実像ができます！';
          } else if (opt.u > 20) {
            relation = '焦点距離の2倍より外側なので、実物より小さい倒立実像ができます。';
          } else {
            relation = '焦点と2倍の間なので、実物より大きい倒立実像ができます！';
          }
          statusText.textContent = `【倒立実像】右 ${opt.v.toFixed(1)}cm に集まりました。${relation}`;
        } else {
          statusIcon.textContent = '🌫️';

        statusIcon.textContent = '🔎';
        statusText.textContent = `【正立虚像】光は広がってスクリーンには映らず、レンズをのぞくと左 ${Math.abs(opt.v).toFixed(1)}cm に ${opt.mag.toFixed(1)}倍 の大きな虚像が見えます！`;
      } else {
        statusIcon.textContent = '⚡';

    // ==========================================
    // キャンバス描画関数群
    // ==========================================
    function drawGridAndRuler() {
      ctx.save();

      // 1. 方眼グリッド (5cm間隔の主線 + 1cm間隔の細線)
      for (let cm = -50; cm <= 50; cm++) {
        const x = cm * PX_PER_CM;
        const isMajor = cm % 5 === 0;
        ctx.strokeStyle = isMajor ? 'rgba(148, 163, 184, 0.14)' : 'rgba(148, 163, 184, 0.04)';
        ctx.lineWidth = (isMajor ? 1.2 : 0.8) / zoom;
        ctx.beginPath();
        ctx.moveTo(x, -1200);
        ctx.lineTo(x, 1200);
        ctx.stroke();
      }
      for (let cm = -25; cm <= 25; cm++) {
        const y = cm * PX_PER_CM;
        const isMajor = cm % 5 === 0;
        ctx.strokeStyle = isMajor ? 'rgba(148, 163, 184, 0.14)' : 'rgba(148, 163, 184, 0.04)';
        ctx.lineWidth = (isMajor ? 1.2 : 0.8) / zoom;
        ctx.beginPath();
        ctx.moveTo(-1600, y);
        ctx.lineTo(1600, y);
        ctx.stroke();
      }

      // 2. 光軸（水平の基準線 y = 0）
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.72)';
      ctx.lineWidth = 2 / zoom;
      ctx.setLineDash([8 / zoom, 6 / zoom]);
      ctx.beginPath();
      ctx.moveTo(-1400, 0);
      ctx.lineTo(1400, 0);
      ctx.stroke();

      // 3. 凸レンズの中心線（垂直基準線 x = 0）
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
      ctx.lineWidth = 1.5 / zoom;
      ctx.setLineDash([5 / zoom, 5 / zoom]);
      ctx.beginPath();
      ctx.moveTo(0, -LENS_HALF_H_CM * PX_PER_CM - 35);
      ctx.lineTo(0, LENS_HALF_H_CM * PX_PER_CM + 35);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. 光学台定規（cm目盛り）
      const rulerY = (LENS_HALF_H_CM + 1.8) * PX_PER_CM;
      ctx.strokeStyle = 'rgba(100, 116, 139, 0.55)';
      ctx.lineWidth = 2 / zoom;
      ctx.beginPath();
      ctx.moveTo(-36 * PX_PER_CM, rulerY);
      ctx.lineTo(36 * PX_PER_CM, rulerY);
      ctx.stroke();

      for (let cm = -35; cm <= 35; cm++) {
        const x = cm * PX_PER_CM;
        const isTen = cm % 10 === 0;
        const isFive = cm % 5 === 0;
        const tickH = isTen ? 11 : isFive ? 7 : 4;

        ctx.strokeStyle = isTen ? 'rgba(203, 213, 225, 0.85)' : 'rgba(148, 163, 184, 0.45)';
        ctx.lineWidth = (isTen ? 1.8 : 1) / zoom;
        ctx.beginPath();
        ctx.moveTo(x, rulerY - tickH / 2);
        ctx.lineTo(x, rulerY + tickH / 2);
        ctx.stroke();

        if (isFive) {
          ctx.fillStyle = isTen ? '#e2e8f0' : 'rgba(148, 163, 184, 0.75)';
          ctx.font = `${isTen ? '900' : '700'} ${(isTen ? 11 : 9.5) / zoom}px "Noto Sans JP"`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(cm === 0 ? '0' : `${Math.abs(cm)}`, x, rulerY + 8 / zoom);
        }
      }

      // 定規の単位ラベル
      ctx.fillStyle = 'rgba(148, 163, 184, 0.75)';
      ctx.font = `bold ${10.5 / zoom}px "Noto Sans JP"`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('(cm)', 36.6 * PX_PER_CM, rulerY);

      ctx.restore();
    }

    // 凸レンズ本体の描画
    function drawConvexLens() {
      ctx.save();
      const halfWidth = 24;
      const h = LENS_HALF_H_CM * PX_PER_CM;

      ctx.shadowColor = 'rgba(56, 189, 248, 0.32)';
      ctx.shadowBlur = 22;

      const grad = ctx.createLinearGradient(-halfWidth, -h, halfWidth, h);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0.36)');
      grad.addColorStop(0.5, 'rgba(186, 230, 253, 0.22)');
      grad.addColorStop(1, 'rgba(14, 165, 233, 0.42)');

      ctx.fillStyle = grad;
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 2.6 / zoom;

      ctx.beginPath();
      ctx.moveTo(0, -h);
      ctx.quadraticCurveTo(halfWidth * 1.4, 0, 0, h);
      ctx.quadraticCurveTo(-halfWidth * 1.4, 0, 0, -h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // レンズ内部ハイライト
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
      ctx.lineWidth = 1.8 / zoom;
      ctx.beginPath();
      ctx.moveTo(-halfWidth * 0.22, -h * 0.78);
      ctx.quadraticCurveTo(-halfWidth * 0.85, 0, -halfWidth * 0.22, h * 0.78);
      ctx.stroke();

      // レンズ中心点
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2 / zoom;
      ctx.beginPath();
      ctx.arc(0, 0, 4 / zoom, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 上部ラベル
      ctx.fillStyle = '#bae6fd';
      ctx.font = `900 ${11.5 / zoom}px "Noto Sans JP"`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('凸レンズ', 0, -h - 8 / zoom);

      ctx.restore();
    }

    // 焦点 F (10cm) ＆ 2倍点 2F (20cm) の描画
    function drawFocalPoints() {
      ctx.save();
      const fPx = FOCAL_CM * PX_PER_CM;

      // 焦点 F（±10cm）
      [-fPx, fPx].forEach(x => {
        ctx.fillStyle = '#0284c7';
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 2 / zoom;
        ctx.beginPath();
        ctx.arc(x, 0, 8.5 / zoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = `900 ${10 / zoom}px "Noto Sans JP"`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('F', x, 0.5 / zoom);

        ctx.fillStyle = 'rgba(125, 211, 252, 0.85)';
        ctx.font = `bold ${9.5 / zoom}px "Noto Sans JP"`;
        ctx.textBaseline = 'top';
        ctx.fillText('焦点(10)', x, 13 / zoom);
      });

      // 2F（±20cm）の控えめな基準点
      [-2 * fPx, 2 * fPx].forEach(x => {
        ctx.fillStyle = 'rgba(148, 163, 184, 0.75)';
        ctx.beginPath();
        ctx.arc(x, 0, 4 / zoom, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(148, 163, 184, 0.75)';
        ctx.font = `bold ${9.5 / zoom}px "Noto Sans JP"`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('2F(20)', x, 9 / zoom);
      });

      ctx.restore();
    }

    // 光源（上向き矢印＋土台：ドラッグで移動＆タップで点灯）
    function drawLightSource(opt) {
      ctx.save();
      const { sx, sy } = opt;
      const isHoverOrDrag = draggingTarget === 'source' || hoverTarget === 'source';

      // 操作可能エリアのガイド枠
      ctx.strokeStyle = isHoverOrDrag ? '#fbbf24' : 'rgba(251, 191, 36, 0.28)';
      ctx.fillStyle = isHoverOrDrag ? 'rgba(251, 191, 36, 0.12)' : 'rgba(15, 23, 42, 0.3)';
      ctx.lineWidth = (isHoverOrDrag ? 2 : 1.2) / zoom;
      ctx.setLineDash([4 / zoom, 3 / zoom]);
      ctx.beginPath();
      ctx.roundRect(sx - 18, sy - 14, 36, Math.abs(sy) + 34, 8);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);

      // 土台ブロック
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = isHoverOrDrag ? '#fbbf24' : '#94a3b8';
      ctx.lineWidth = 1.6 / zoom;
      ctx.beginPath();
      ctx.roundRect(sx - 14, 0, 28, 14, 4);
      ctx.fill();
      ctx.stroke();

      // 上向きの光源矢印本体
      ctx.shadowColor = isLightActive ? '#fbbf24' : 'rgba(251, 191, 36, 0.35)';
      ctx.shadowBlur = isLightActive ? 16 : 6;

      const headSize = 13;
      const headW = 9;
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 6 / zoom;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, sy + headSize * 0.6);
      ctx.stroke();

      ctx.fillStyle = isLightActive ? '#fef08a' : '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - headW, sy + headSize);
      ctx.lineTo(sx + headW, sy + headSize);
      ctx.closePath();
      ctx.fill();

      // 先端の発光コア
      if (isLightActive) {
        drawPhoton(sx, sy, '#fde047', 6 / zoom);
      }

      // ラベル表示
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fde68a';
      ctx.font = `900 ${11 / zoom}px "Noto Sans JP"`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(`光源 (${opt.u.toFixed(1)}cm)`, sx, sy - 18 / zoom);

      ctx.fillStyle = isHoverOrDrag ? '#fbbf24' : 'rgba(148, 163, 184, 0.75)';
      ctx.font = `bold ${9.5 / zoom}px "Noto Sans JP"`;
      ctx.textBaseline = 'top';
      ctx.fillText('◀ 動かす ▶', sx, 18 / zoom);

      ctx.restore();
    }

    // 像の位置・大きさコールアウト吹き出し
    function drawImageCallout(cx, cy, text, borderColor, textColor) {
      ctx.save();
      ctx.font = `900 ${11.5 / zoom}px "Noto Sans JP"`;
      const tw = ctx.measureText(text).width + 18 / zoom;
      const th = 24 / zoom;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.6 / zoom;
      ctx.beginPath();
      ctx.roundRect(cx - tw / 2, cy - th / 2, tw, th, 7 / zoom);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, cx, cy);
      ctx.restore();
    }

    // スクリーンの描画（光が集まったタイミングでパッと出現＋像の投影。虚像時は非表示）
    function drawScreenAndRealImage(opt) {
      // 光が集まって実像ができるタイミングになるまでスクリーンは表示しない
      if (!isScreenVisible(opt)) return;

      ctx.save();
      const sx = opt.screenX;
      const halfH = SCREEN_HALF_H_CM * PX_PER_CM;
      const isHoverOrDrag = draggingTarget === 'screen' || hoverTarget === 'screen';

      // 光が集まった瞬間(0.88〜0.98)にパッと出現するアニメーション係数
      const appearAlpha = Math.min(1, (animProgress - 0.88) / 0.10);
      const popScaleY = 0.88 + 0.12 * appearAlpha;

      ctx.save();
      ctx.globalAlpha = appearAlpha;

      // 集光点にスクリーンが現れた瞬間の光リング演出
      if (animProgress < 1.0 && opt.isFocused) {
        const ringT = (animProgress - 0.88) / 0.12;
        const ringR = (10 + ringT * 34) / zoom;
        ctx.save();
        ctx.strokeStyle = `rgba(125, 211, 252, ${Math.max(0, 1 - ringT) * 0.9})`;
        ctx.lineWidth = 3 / zoom;
        ctx.beginPath();
        ctx.arc(opt.imgX, opt.imgTipY, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // スクリーンの土台
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = isHoverOrDrag ? '#38bdf8' : '#64748b';
      ctx.lineWidth = (isHoverOrDrag ? 2.2 : 1.5) / zoom;
      ctx.beginPath();
      ctx.roundRect(sx - 10, halfH * popScaleY, 20, 14, 4);
      ctx.fill();
      ctx.stroke();

      // スクリーン板本体（半透明パネル）
      ctx.fillStyle = opt.isFocused
        ? 'rgba(56, 189, 248, 0.20)'
        : 'rgba(226, 232, 240, 0.14)';
      ctx.strokeStyle = isHoverOrDrag
        ? '#38bdf8'
        : opt.isFocused
          ? '#7dd3fc'
          : '#94a3b8';
      ctx.lineWidth = 3.5 / zoom;
      ctx.beginPath();
      ctx.roundRect(sx - 4, -halfH * popScaleY, 8, halfH * 2 * popScaleY, 3);
      ctx.fill();
      ctx.stroke();

      // スクリーンラベル
      ctx.fillStyle = isHoverOrDrag ? '#7dd3fc' : '#cbd5e1';
      ctx.font = `900 ${11.5 / zoom}px "Noto Sans JP"`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(`スクリーン (${screenDistCm.toFixed(1)}cm)`, sx, -halfH * popScaleY - 8 / zoom);

      ctx.fillStyle = isHoverOrDrag ? '#38bdf8' : 'rgba(148, 163, 184, 0.7)';
      ctx.font = `bold ${9.5 / zoom}px "Noto Sans JP"`;
      ctx.textBaseline = 'top';
      ctx.fillText('◀ 動かす ▶', sx, halfH * popScaleY + 17 / zoom);

      // 実像の描画
      const blurFactor = Math.min(1, opt.spreadPx / 45);
      const tipY = opt.isFocused ? opt.imgTipY : opt.screenTipY;

      ctx.save();
      ctx.globalAlpha = appearAlpha * (1 - blurFactor * 0.55);

      if (!opt.isFocused) {
        // ピントずれ時のぼやけグロー
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = Math.min(28, 6 + opt.spreadPx * 0.6);
      } else {
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 14;
      }

      // 倒立実像の矢印（スクリーン上に下向きに映る）
      const arrowX = sx;
      const headSize = Math.max(7, Math.min(16, Math.abs(tipY) * 0.25));
      const headW = headSize * 0.65;

      ctx.strokeStyle = opt.isFocused ? '#fbbf24' : 'rgba(251, 191, 36, 0.65)';
      ctx.lineWidth = (opt.isFocused ? 5.5 : 5.5 + blurFactor * 8) / zoom;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(arrowX, 0);
      ctx.lineTo(arrowX, tipY - headSize * 0.6);
      ctx.stroke();

      ctx.fillStyle = opt.isFocused ? '#fef08a' : 'rgba(254, 240, 138, 0.65)';
      ctx.beginPath();
      ctx.moveTo(arrowX, tipY);
      ctx.lineTo(arrowX - headW, tipY - headSize);
      ctx.lineTo(arrowX + headW, tipY - headSize);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // ピント合致時の像サイズ・位置ラベル（数値表示ON時）
      if (showInfo && opt.isFocused && appearAlpha > 0.6) {
        drawImageCallout(
          opt.imgX,
          opt.imgTipY + 26 / zoom,
          `倒立実像：右 ${opt.v.toFixed(1)}cm ／ ${opt.imgHeightCm.toFixed(1)}cm (${opt.mag.toFixed(1)}倍)`,
          '#38bdf8',
          '#bae6fd'
        );
      } else if (showInfo && !opt.isFocused && appearAlpha > 0.6) {
        // ピントずれのとき、本来の実像位置に小さな目安ピンを表示
        ctx.save();
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.7)';
        ctx.lineWidth = 1.5 / zoom;
        ctx.setLineDash([4 / zoom, 3 / zoom]);
        ctx.beginPath();
        ctx.moveTo(opt.imgX, 0);
        ctx.lineTo(opt.imgX, opt.imgTipY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(opt.imgX, opt.imgTipY, 4.5 / zoom, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = `bold ${10.5 / zoom}px "Noto Sans JP"`;
        ctx.textAlign = 'center';
        ctx.fillText(`ピント位置 (${opt.v.toFixed(1)}cm)`, opt.imgX, opt.imgTipY + 16 / zoom);
        ctx.restore();
      }

      ctx.restore();
      ctx.restore();
    }

    // 虚像（正立・破線輪郭・幻想的な光彩）と「目」のアイコン描画
    function drawVirtualImageAndEye(opt) {
      if (opt.type !== 'virtual') return;
      // 消灯中やレンズ通過前はネタバレ防止のため表示しない
      if (!isLightActive || animProgress < 0.55) return;

      // レンズの右側からのぞき込む「目」のイラスト（光が広がり始めたタイミングでフェードイン）
      const eyeAlpha = Math.min(1, (animProgress - 0.55) / 0.12);
      ctx.save();
      ctx.globalAlpha = eyeAlpha;

      const eyeX = 25.5 * PX_PER_CM;
      const eyeY = 2.0 * PX_PER_CM;

      // 目の外形（左のレンズ方向を向く）
      ctx.strokeStyle = '#e2e8f0';
      ctx.fillStyle = '#0f172a';
      ctx.lineWidth = 2.2 / zoom;
      ctx.beginPath();
      ctx.moveTo(eyeX - 18, eyeY);
      ctx.quadraticCurveTo(eyeX + 4, eyeY - 16, eyeX + 20, eyeY);
      ctx.quadraticCurveTo(eyeX + 4, eyeY + 16, eyeX - 18, eyeY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 瞳（レンズ方向を向く）
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(eyeX - 6, eyeY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(eyeX - 8, eyeY, 2.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.font = `bold ${10.5 / zoom}px "Noto Sans JP"`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('ここからレンズをのぞく', eyeX, eyeY + 16 / zoom);
      ctx.restore();

      // 延長線が交わったタイミング(0.88〜)で正立虚像を浮かび上がらせる
      if (animProgress < 0.88) return;
      const vAlpha = Math.min(1, (animProgress - 0.88) / 0.10);

      ctx.save();
      ctx.globalAlpha = vAlpha;

      const vx = opt.imgX;
      const tipY = opt.imgTipY;
      const headSize = Math.max(12, Math.min(24, Math.abs(tipY) * 0.18));
      const headW = headSize * 0.65;

      // 幻想的なパープルグロー
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 18;

      // 破線枠の正立矢印（虚像であることを視覚的に明確化）
      ctx.strokeStyle = '#d8b4fe';
      ctx.lineWidth = 5 / zoom;
      ctx.setLineDash([7 / zoom, 5 / zoom]);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(vx, 0);
      ctx.lineTo(vx, tipY + headSize * 0.7);
      ctx.stroke();
      ctx.setLineDash([]);

      // 矢印先端（半透明塗り＋破線縁取り）
      ctx.fillStyle = 'rgba(216, 180, 254, 0.45)';
      ctx.strokeStyle = '#f3e8ff';
      ctx.lineWidth = 2.2 / zoom;
      ctx.beginPath();
      ctx.moveTo(vx, tipY);
      ctx.lineTo(vx - headW, tipY + headSize);
      ctx.lineTo(vx + headW, tipY + headSize);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 交点の光マーク
      drawPhoton(vx, tipY, '#d8b4fe', 5.5 / zoom);

      if (showInfo && vAlpha > 0.6) {
        drawImageCallout(
          vx,
          tipY - 24 / zoom,
          `正立虚像：左 ${Math.abs(opt.v).toFixed(1)}cm ／ ${opt.imgHeightCm.toFixed(1)}cm (${opt.mag.toFixed(1)}倍)`,
          '#c084fc',
          '#f3e8ff'
        );
      }

      ctx.restore();
    }

    // 3層発光レーザー描画関数
    function drawLaserSegment(x1, y1, x2, y2, style) {
      ctx.save();
      ctx.lineCap = 'round';

      // 外側グロー層
      ctx.lineWidth = 10 / zoom;
      ctx.strokeStyle = style.glow;
      ctx.shadowColor = style.shadow;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // 中間カラー層
      ctx.lineWidth = 4.5 / zoom;
      ctx.strokeStyle = style.mid;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // 中心ホワイトコア層
      ctx.lineWidth = 1.8 / zoom;
      ctx.strokeStyle = style.core;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.restore();
    }

    // 光線上の進行方向矢印（▶）
    function drawDirectionArrow(x1, y1, x2, y2, ratio, color, size = 8.5) {
      const ax = x1 + (x2 - x1) * ratio;
      const ay = y1 + (y2 - y1) * ratio;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const s = size / zoom;

      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(angle);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(s, 0);
      ctx.lineTo(-s * 0.75, -s * 0.65);
      ctx.lineTo(-s * 0.35, 0);
      ctx.lineTo(-s * 0.75, s * 0.65);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 光粒子（フォトン）の描画
    function drawPhoton(x, y, color, r = 6) {
      ctx.save();
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.45, color);
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 2本の光のアニメーション描画
    function drawAnimatedRays(opt) {
      const isVirtual = opt.type === 'virtual';

      // フェーズ分割（実像：0〜0.42 レンズまで、0.42〜0.88 集光点まで→到達瞬間にスクリーン出現）
      // 虚像：0〜0.34 レンズまで、0.34〜0.64 右へ広がる、0.64〜0.88 左へ逆向き延長点線→虚像出現
      const tLens = isVirtual ? 0.34 : 0.42;
      const tRight = isVirtual ? 0.64 : 0.88;
      const tExtEnd = 0.88;

      const rays = [
        {
          style: RAY_COLORS.parallel,
          sx: opt.sx,
          sy: opt.sy,
          lensX: 0,
          lensY: opt.sy,
          endX: opt.rightEndX,
          endY: opt.y1AtRight
        },
        {
          style: RAY_COLORS.center,
          sx: opt.sx,
          sy: opt.sy,
          lensX: 0,
          lensY: 0,
          endX: opt.rightEndX,
          endY: opt.y2AtRight
        }
      ];

      ctx.save();

      rays.forEach(ray => {
        // 第1区間：光源先端 -> 凸レンズ
        if (animProgress > 0) {
          const p1 = Math.min(1, animProgress / tLens);
          const curX1 = ray.sx + (ray.lensX - ray.sx) * p1;
          const curY1 = ray.sy + (ray.lensY - ray.sy) * p1;

          drawLaserSegment(ray.sx, ray.sy, curX1, curY1, ray.style);

          if (p1 > 0.55) {
            drawDirectionArrow(ray.sx, ray.sy, ray.lensX, ray.lensY, 0.52, ray.style.shadow);
          }

          if (p1 < 1) {
            drawPhoton(curX1, curY1, ray.style.mid, 6.5 / zoom);
          } else {
            drawPhoton(ray.lensX, ray.lensY, ray.style.mid, 4.5 / zoom);
          }
        }

        // 第2区間：凸レンズ -> 右側（集光点／スクリーン、または発散）
        if (animProgress > tLens) {
          const p2 = Math.min(1, (animProgress - tLens) / (tRight - tLens));
          const curX2 = ray.lensX + (ray.endX - ray.lensX) * p2;
          const curY2 = ray.lensY + (ray.endY - ray.lensY) * p2;

          drawLaserSegment(ray.lensX, ray.lensY, curX2, curY2, ray.style);

          if (p2 > 0.45) {
            drawDirectionArrow(ray.lensX, ray.lensY, ray.endX, ray.endY, 0.48, ray.style.shadow);
          }

          if (p2 < 1) {
            drawPhoton(curX2, curY2, ray.style.mid, 6.5 / zoom);
          }
        }

        // 第3区間（虚像時のみ）：レンズから左の虚像先端へ向かう逆向き延長点線
        if (isVirtual && animProgress > tRight) {
          const p3 = Math.min(1, (animProgress - tRight) / (tExtEnd - tRight));
          const curEx = ray.lensX + (opt.imgX - ray.lensX) * p3;
          const curEy = ray.lensY + (opt.imgTipY - ray.lensY) * p3;

          ctx.save();
          ctx.strokeStyle = 'rgba(216, 180, 254, 0.85)';
          ctx.lineWidth = 2.4 / zoom;
          ctx.setLineDash([7 / zoom, 5 / zoom]);
          ctx.beginPath();
          ctx.moveTo(ray.lensX, ray.lensY);
          ctx.lineTo(curEx, curEy);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();

          if (p3 < 1) {
            drawPhoton(curEx, curEy, '#d8b4fe', 5 / zoom);
          }
        }

        // アニメーション完了後の光パルス演出
        if (animProgress >= 1.0) {
          const splitPulse = 0.42;
          if (pulseTime <= splitPulse) {
            const pr = pulseTime / splitPulse;
            drawPhoton(
              ray.sx + (ray.lensX - ray.sx) * pr,
              ray.sy + (ray.lensY - ray.sy) * pr,
              ray.style.mid,
              5.5 / zoom
            );
          } else {
            const pr = (pulseTime - splitPulse) / (1 - splitPulse);
            drawPhoton(
              ray.lensX + (ray.endX - ray.lensX) * pr,
              ray.lensY + (ray.endY - ray.lensY) * pr,
              ray.style.mid,
              5.5 / zoom
            );
          }
        }
      });

      ctx.restore();
    }

    // 右上ミニモニター（スクリーン正面／虫めがね視点）の描画
    function drawPreviewMonitor(opt) {
      const pw = previewCanvas.width;
      const ph = previewCanvas.height;
      pCtx.clearRect(0, 0, pw, ph);

      // 背景と中央クロスヘア
      pCtx.fillStyle = '#020617';
      pCtx.fillRect(0, 0, pw, ph);

      pCtx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
      pCtx.lineWidth = 1;
      pCtx.beginPath();
      pCtx.moveTo(pw / 2, 0);
      pCtx.lineTo(pw / 2, ph);
      pCtx.moveTo(0, ph / 2);
      pCtx.lineTo(pw, ph / 2);
      pCtx.stroke();

      if (!isLightActive || animProgress < 0.88) {
        previewTitle.textContent = '📺 像の見え方';
        previewTitle.className = 'text-[10px] font-black text-slate-300';
        previewFocusTag.textContent = isLightActive ? '移動中…' : '予想中';
        previewFocusTag.className = 'text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-800 text-slate-400';
        return;
      }

      if (opt.type === 'virtual') {
        previewTitle.textContent = '🔎 レンズの奥を見る';
        previewTitle.className = 'text-[10px] font-black text-purple-300';
      } else {
        previewTitle.textContent = '📺 スクリーン正面';
        previewTitle.className = 'text-[10px] font-black text-cyan-300';
      }

      if (opt.type === 'real') {
        const blur = opt.isFocused ? 0 : Math.min(10, opt.spreadPx * 0.18);
        const arrowLen = Math.min(ph * 0.44, Math.max(10, opt.imgHeightCm * 6.5));

        previewFocusTag.textContent = opt.isFocused ? 'くっきり' : 'ぼやけ';
        previewFocusTag.className = opt.isFocused
          ? 'text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300'
          : 'text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300';

        pCtx.save();
        if (blur > 0.3) {
          pCtx.filter = `blur(${blur.toFixed(1)}px)`;
        }
        pCtx.strokeStyle = '#fbbf24';
        pCtx.fillStyle = '#fef08a';
        pCtx.lineWidth = 4;
        pCtx.lineCap = 'round';

        // 倒立（下向き）矢印
        const cx = pw / 2;
        const startY = ph / 2;
        const endY = startY + arrowLen;
        const hs = Math.min(12, arrowLen * 0.35);

        pCtx.beginPath();
        pCtx.moveTo(cx, startY);
        pCtx.lineTo(cx, endY - hs * 0.6);
        pCtx.stroke();

        pCtx.beginPath();
        pCtx.moveTo(cx, endY);
        pCtx.lineTo(cx - hs * 0.7, endY - hs);
        pCtx.lineTo(cx + hs * 0.7, endY - hs);
        pCtx.closePath();
        pCtx.fill();
        pCtx.restore();
      } else if (opt.type === 'virtual') {
        previewFocusTag.textContent = `${opt.mag.toFixed(1)}倍拡大`;
        previewFocusTag.className = 'text-[9px] font-black px-1.5 py-0.5 rounded bg-purple-500/25 text-purple-200';

        // 虫めがね枠
        pCtx.save();
        pCtx.strokeStyle = 'rgba(192, 132, 252, 0.55)';
        pCtx.lineWidth = 2;
        pCtx.beginPath();
        pCtx.arc(pw / 2, ph / 2, pw * 0.44, 0, Math.PI * 2);
        pCtx.stroke();

        const arrowLen = Math.min(ph * 0.44, Math.max(18, opt.imgHeightCm * 4.5));
        const cx = pw / 2;
        const startY = ph / 2;
        const endY = startY - arrowLen;
        const hs = Math.min(14, arrowLen * 0.32);

        // 正立（上向き）矢印
        pCtx.strokeStyle = '#d8b4fe';
        pCtx.fillStyle = '#f3e8ff';
        pCtx.lineWidth = 5;
        pCtx.lineCap = 'round';
        pCtx.beginPath();
        pCtx.moveTo(cx, startY);
        pCtx.lineTo(cx, endY + hs * 0.6);
        pCtx.stroke();

        pCtx.beginPath();
        pCtx.moveTo(cx, endY);
        pCtx.lineTo(cx - hs * 0.7, endY + hs);
        pCtx.lineTo(cx + hs * 0.7, endY + hs);
        pCtx.closePath();
        pCtx.fill();
        pCtx.restore();
      } else {
        previewFocusTag.textContent = '像なし';
        previewFocusTag.className = 'text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-800 text-slate-400';
      }
    }

    // ==========================================
    // メインレンダリングループ
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, width, height);

      const opt = calculateOptics();

      if (isLightActive) {
        if (isAnimating) {
          animProgress += ANIM_SPEED;
          if (!hasRevealedResult && animProgress >= 0.88) {
            hasRevealedResult = true;
            updateUI();
          }
          if (animProgress >= 1.0) {
            animProgress = 1.0;
            isAnimating = false;
          }
        } else {
          pulseTime = (pulseTime + 0.0035) % 1.0;
        }
      }

      ctx.save();
      ctx.translate(width / 2 + panX, height / 2 + panY);
      ctx.scale(zoom, zoom);

      drawGridAndRuler();
      drawConvexLens();
      drawFocalPoints();

      if (isLightActive) {
        drawAnimatedRays(opt);
      }

      drawScreenAndRealImage(opt);
      drawVirtualImageAndEye(opt);
      drawLightSource(opt);

      ctx.restore();

      drawPreviewMonitor(opt);

      requestAnimationFrame(render);
    }

    // ==========================================
    // ポインター・タッチ操作ハンドラー
    // ==========================================
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top
        };
      }
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function detectHitTarget(wp) {
      const hitScale = Math.max(1, 1 / zoom);
      const sx = -sourceDistCm * PX_PER_CM;
      const screenX = screenDistCm * PX_PER_CM;
      const opt = calculateOptics();

      // 光源の当たり判定
      if (
        Math.abs(wp.x - sx) <= 26 * hitScale &&
        wp.y >= -SOURCE_HEIGHT_CM * PX_PER_CM - 30 * hitScale &&
        wp.y <= 30 * hitScale
      ) {
        return 'source';
      }

      // スクリーンの当たり判定（スクリーンが表示されている実像時のみ操作可能）
      if (
        isScreenVisible(opt) &&
        Math.abs(wp.x - screenX) <= 24 * hitScale &&
        wp.y >= -SCREEN_HALF_H_CM * PX_PER_CM - 20 * hitScale &&
        wp.y <= SCREEN_HALF_H_CM * PX_PER_CM + 30 * hitScale
      ) {
        return 'screen';
      }

      return null;
    }

    function toggleLight() {
      if (!isLightActive) {
        isLightActive = true;
        animProgress = 0;
        isAnimating = true;
        hasRevealedResult = false;
        pulseTime = 0;
      } else {
        isLightActive = false;
        animProgress = 0;
        isAnimating = false;
        hasRevealedResult = false;
      }
      updateUI();
    }

    function setSourcePreset(cm) {
      sourceDistCm = cm;
      isAutoFocus = true;
      syncScreenToAutoFocus();
      // 光源の位置を変えたら予想しやすいように一度消灯し、スクリーンを非表示にする
      isLightActive = false;
      animProgress = 0;
      isAnimating = false;
      hasRevealedResult = false;
      updateUI();
    }

    function onPointerDown(e) {
      const pos = getPointerPos(e);
      pointerDownX = pos.x;
      pointerDownY = pos.y;
      hasDragged = false;

      const wp = screenToWorld(pos.x, pos.y);
      const hit = detectHitTarget(wp);

      if (hit === 'source') {
        draggingTarget = 'source';
      } else if (hit === 'screen') {
        draggingTarget = 'screen';
      } else {
        draggingTarget = 'pan';
        panStartX = pos.x - panX;
        panStartY = pos.y - panY;
      }
    }

    function onPointerMove(e) {
      const pos = getPointerPos(e);
      const wp = screenToWorld(pos.x, pos.y);

      if (draggingTarget) {
        if (e.cancelable) e.preventDefault();

        // タップ時の指の微小なブレはドラッグとみなさない
        if (!hasDragged && Math.hypot(pos.x - pointerDownX, pos.y - pointerDownY) < 7) {
          return;
        }
        hasDragged = true;

        if (draggingTarget === 'source') {
          let newCm = -wp.x / PX_PER_CM;
          newCm = Math.max(MIN_SOURCE_CM, Math.min(MAX_SOURCE_CM, newCm));

          // プリセット値（30, 20, 15, 10, 7, 5cm）の近くで軽くスナップ
          let snapped = false;
          for (const preset of PRESET_POSITIONS) {
            if (Math.abs(newCm - preset) <= 0.45) {
              newCm = preset;
              snapped = true;
              break;
            }
          }
          if (!snapped) {
            newCm = Math.round(newCm * 2) / 2; // 0.5cm刻み
          }

          sourceDistCm = newCm;
          isAutoFocus = true;
          syncScreenToAutoFocus();

          // 光源を動かしている間はスクリーンを消し、予想してから光を出せる状態にする
          isLightActive = false;
          animProgress = 0;
          isAnimating = false;
          hasRevealedResult = false;
          updateUI();
        } else if (draggingTarget === 'screen') {
          let newScreenCm = wp.x / PX_PER_CM;
          newScreenCm = Math.max(MIN_SCREEN_CM, Math.min(MAX_SCREEN_CM, newScreenCm));

          const opt = calculateOptics();
          if (opt.type === 'real' && Math.abs(newScreenCm - opt.v) <= 0.55) {
            newScreenCm = opt.v;
            isAutoFocus = true;
          } else {
            newScreenCm = Math.round(newScreenCm * 2) / 2;
            isAutoFocus = false;
          }

          screenDistCm = newScreenCm;
          updateUI();
        } else if (draggingTarget === 'pan') {
          panX = pos.x - panStartX;
          panY = pos.y - panStartY;
        }
      } else {
        hoverTarget = detectHitTarget(wp);
        if (hoverTarget === 'source' || hoverTarget === 'screen') {
          canvas.style.cursor = 'ew-resize';
        } else {
          canvas.style.cursor = 'default';
        }
      }
    }

    function onPointerUp() {
      // 光源をドラッグせずにタップした場合は光のON/OFFを切り替え
      if (draggingTarget === 'source' && !hasDragged) {
        toggleLight();
      }
      draggingTarget = null;
      hasDragged = false;
    }

    // ==========================================
    // イベントリスナー登録
    // ==========================================
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    // マルチタッチ（1本指操作 ＆ 2本指ピンチ拡大縮小）
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        onPointerDown(e);
      } else if (e.touches.length === 2) {
        draggingTarget = null;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchZoom = zoom;
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (e.touches.length === 1) {
        onPointerMove(e);
      } else if (e.touches.length === 2 && initialPinchDist) {
        if (e.cancelable) e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const rect = canvas.getBoundingClientRect();
        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        setZoom(initialPinchZoom * (dist / initialPinchDist), centerX, centerY);
      }
    }, { passive: false });

    window.addEventListener('touchend', e => {
      if (e.touches.length === 0) {
        onPointerUp();
      } else if (e.touches.length < 2) {
        initialPinchDist = null;
      }
    });

    // マウスホイールでの拡大縮小
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      setZoom(zoom * factor, mx, my);
    }, { passive: false });

    window.addEventListener('resize', resizeCanvas);

    // UIボタンイベント
    emitLightBtn.addEventListener('click', toggleLight);

    posButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        setSourcePreset(Number(btn.dataset.pos));
      });
    });

    autoFocusBtn.addEventListener('click', () => {
      isAutoFocus = true;
      syncScreenToAutoFocus();
      updateUI();
    });

    toggleInfoBtn.addEventListener('click', () => {
      showInfo = !showInfo;
      updateUI();
    });

    zoomInBtn.addEventListener('click', () => setZoom(zoom + 0.18));
    zoomOutBtn.addEventListener('click', () => setZoom(zoom - 0.18));
    zoomResetBtn.addEventListener('click', fitToScreen);

    resetBtn.addEventListener('click', () => {
      isLightActive = false;
      animProgress = 0;
      isAnimating = false;
      hasRevealedResult = false;
      sourceDistCm = 30.0;
      isAutoFocus = true;
      showInfo = true;
      syncScreenToAutoFocus();
      fitToScreen();
      updateUI();
    });

    // ==========================================
    // 初期起動
    // ==========================================
    window.onload = () => {
      try {
        resizeCanvas();
        syncScreenToAutoFocus();
        updateUI();
        render();
      } catch (err) {
        console.error('Initialization error:', err);
      }
    };
  </script>
</body>
</html>
